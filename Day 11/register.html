{% extends "base.html" %}
{% block title %}Register Student – Student Portal{% endblock %}

{% block content %}
<section class="page-header">
  <h1>Register New Student</h1>
  <p>Fill in the details below to add a new student to the portal.</p>
</section>

<div class="form-container">
  <form action="{{ url_for('register') }}" method="POST" class="student-form">

    <div class="form-group">
      <label for="name">Full Name <span class="required">*</span></label>
      <input type="text" id="name" name="name" placeholder="e.g. Priya Sharma" required />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="school">School</label>
        <select id="school" name="school">
          <option value="GP">GP – Gabriel Pereira</option>
          <option value="MS">MS – Mousinho da Silveira</option>
        </select>
      </div>
      <div class="form-group">
        <label for="age">Age <span class="required">*</span></label>
        <input type="number" id="age" name="age" min="14" max="22" placeholder="e.g. 17" required />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="address">Address Type</label>
        <select id="address" name="address">
          <option value="Urban">Urban</option>
          <option value="Rural">Rural</option>
        </select>
      </div>
      <div class="form-group">
        <label for="studytime">Weekly Study Time</label>
        <select id="studytime" name="studytime">
          <option value="1">Less than 2 hours</option>
          <option value="2" selected>2–5 hours</option>
          <option value="3">5–10 hours</option>
          <option value="4">More than 10 hours</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="internet">Internet Access at Home</label>
      <select id="internet" name="internet">
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Register Student</button>
      <a href="{{ url_for('student_list') }}" class="btn btn-outline">Cancel</a>
    </div>

  </form>
</div>
{% endblock %}
